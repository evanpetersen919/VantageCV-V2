# Parking Lot scenario template — see MASTER_PROMPT Section 1.3, Category 5
version: "1.0"
scenario_type: parking_lot

layout:
  lattice_spacing_m: [5.5, 6.5]       # standard parking stall pitch
  aisle_width_m: 7.0
  rows: [4, 12]
  cols: [4, 20]
  through_traffic: false

buildings:
  building_density: 0.05              # occasional structure (e.g. store entrance)
  building_heights: [4.0, 10.0]

traffic:
  traffic_density: [0.1, 0.4]
  # Real 2024 US light-vehicle registration shares -- see
  # city_sample_assets.py's REAL_US_VEHICLE_CLASS_MIX for the full
  # citation and derivation.
  vehicle_mix:
    sedan: 0.181
    suv: 0.614
    truck: 0.175
    bus: 0.03

complexity_score: 20
