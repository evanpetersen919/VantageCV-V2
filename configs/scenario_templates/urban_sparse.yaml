# Urban Sparse scenario template — see MASTER_PROMPT Section 1.3, Category 2
version: "1.0"
scenario_type: urban_sparse

road_network:
  avg_block_size: [200.0, 400.0]
  avg_road_width: 10.0
  num_intersections: [2, 4]
  intersection_types: ["4way", "3way"]

buildings:
  building_density: 0.35              # within documented 0.2-0.5 range
  building_heights: [15.0, 30.0]
  road_setback_meters: 4.0            # wider sidewalks/front yards than urban_dense

traffic:
  traffic_density: [0.2, 0.5]
  # Real 2024 US light-vehicle registration shares -- see
  # city_sample_assets.py's REAL_US_VEHICLE_CLASS_MIX for the full
  # citation and derivation.
  vehicle_mix:
    sedan: 0.181
    suv: 0.614
    truck: 0.175
    bus: 0.03

complexity_score: 45
