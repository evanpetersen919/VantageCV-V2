# Urban Dense scenario template — see MASTER_PROMPT Section 1.3, Category 1
version: "1.0"
scenario_type: urban_dense

road_network:
  avg_block_size: [80.0, 150.0]      # meters, uniform range
  avg_road_width: 12.0               # meters
  num_intersections: [4, 9]
  intersection_types: ["4way", "3way"]

buildings:
  building_density: 0.8              # coverage ratio
  building_heights: [20.0, 40.0]     # meters
  road_setback_meters: 2.0           # narrow sidewalk, buildings close to the curb
  parking_lot_fraction: 0.1          # share of blocks holding a surface lot (design choice)

traffic:
  traffic_density: [0.6, 1.0]
  # Real 2024 US light-vehicle registration shares (SUV 59.10%, car
  # 18.66%, pickup 18.03%, van/minivan 4.21% folded into suv -- see
  # city_sample_assets.py's REAL_US_VEHICLE_CLASS_MIX for the full
  # citation), rescaled to leave a small disclosed bus fraction for
  # scene diversity (city buses aren't part of consumer registration
  # data at all).
  vehicle_mix:
    sedan: 0.181
    suv: 0.614
    truck: 0.175
    bus: 0.03

complexity_score: 80
