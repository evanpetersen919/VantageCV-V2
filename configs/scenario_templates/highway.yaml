# Highway scenario template — see MASTER_PROMPT Section 1.3, Category 3
version: "1.0"
scenario_type: highway

road_network:
  parallel_only: true                 # no intersections
  lanes_per_direction: [3, 6]
  min_length_m: 2000.0
  speed_limit_kmh: [80, 120]
  road_width_m: 30.0

buildings:
  building_density: 0.0
  building_heights: [0.0, 0.0]

traffic:
  traffic_density: [0.3, 0.9]
  # Real 2024 US light-vehicle registration shares -- see
  # city_sample_assets.py's REAL_US_VEHICLE_CLASS_MIX for the full
  # citation and derivation. Real commercial-truck VMT share is known to
  # be higher specifically on highways than the national registration
  # average used here, but no single quick citation for a highway-
  # specific split was found -- using the same national mix rather than
  # inventing a highway-specific adjustment.
  vehicle_mix:
    sedan: 0.181
    suv: 0.614
    truck: 0.175
    bus: 0.03

complexity_score: 30
