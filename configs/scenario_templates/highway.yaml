# Highway scenario template — see MASTER_PROMPT Section 1.3, Category 3
version: "1.0"
scenario_type: highway

road_network:
  parallel_only: true                 # no intersections
  lanes_per_direction: [3, 6]
  min_length_m: 2000.0
  speed_limit_kmh: [80, 120]
  road_width_m: 30.0

buildings:
  building_density: 0.0
  building_heights: [0.0, 0.0]

traffic:
  traffic_density: [0.3, 0.9]
  vehicle_mix:
    sedan: 0.55
    suv: 0.25
    truck: 0.18
    bus: 0.02

complexity_score: 30
