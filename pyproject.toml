[tool.poetry]
name = "synthetic-av-dataset-gen"
version = "0.1.0"
description = "Professional procedural synthetic AV perception dataset generator"
authors = ["Evan Petersen <evanpetersen919@gmail.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "1.26.3"
scipy = "1.11.4"
scikit-learn = "1.3.2"
shapely = "2.0.2"
trimesh = "3.21.0"
pyyaml = "6.0.1"
pandas = "2.1.3"
matplotlib = "3.8.2"
plotly = "5.17.0"
pydantic = "2.5.0"
websockets = "12.0"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"
pytest-cov = "4.1.0"
pytest-xdist = "3.5.0"
hypothesis = "6.88.0"
faker = "21.0.0"
pylint = "3.0.3"
black = "23.12.0"
isort = "5.13.2"
mypy = "1.7.1"
toml = "0.10.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true

# scipy ships no py.typed marker / stubs as of 1.11.4; without this, every
# module that imports scipy.spatial fails --strict with import-untyped.
[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
